# localhost: PrivacyFence (single-user mode), Peek and Grist for one person on one computer, no proxy.
# Everything is published on 127.0.0.1 only; the three apps share PrivacyFence's network namespace.
# Every variable is explained in docs/configurations.md.
name: privacyfence-localhost

services:
  init:
    image: alpine:${ALPINE_IMAGE_TAG:?pin a version in .env}
    network_mode: none
    command: ["/bin/sh", "/init.sh"]
    volumes:
      - ./init.sh:/init.sh:ro
      - pf-secrets:/out/pf
      - peek-secrets:/out/peek
      - grist-secrets:/out/grist
      - provisioner-secrets:/out/provisioner

  privacyfence:
    image: ghcr.io/privacyfence/privacyfence-org:${PRIVACYFENCE_IMAGE_TAG:?pin a version in .env}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8765:8765"
      - "127.0.0.1:7700:7700"
      - "127.0.0.1:8484:8484"
    environment:
      PRIVACYFENCE_PEEK_BASE_URL: http://localhost:7700
      PRIVACYFENCE_PEEK_PROVISIONING_KEY_FILE: /run/suite/peek_provisioning_key
      PRIVACYFENCE_PEEK_AUTO_PROVISION: "true"
      PRIVACYFENCE_GRIST_SERVER_URL: http://localhost:8484
      PRIVACYFENCE_GRIST_PROVISIONER_URL: http://localhost:8485
      PRIVACYFENCE_GRIST_PROVISIONING_KEY_FILE: /run/suite/grist_provisioning_key
      PRIVACYFENCE_GRIST_AUTO_PROVISION: "true"
      PRIVACYFENCE_OIDC_CLIENTS: peek,grist
      PRIVACYFENCE_OIDC_CLIENT_PEEK_REDIRECT_URIS: http://localhost:7700/oauth/oidc/callback
      PRIVACYFENCE_OIDC_CLIENT_PEEK_SECRET_FILE: /run/suite/peek_oidc_client_secret
      PRIVACYFENCE_OIDC_CLIENT_GRIST_REDIRECT_URIS: http://localhost:8484/oauth2/callback
      PRIVACYFENCE_OIDC_CLIENT_GRIST_SECRET_FILE: /run/suite/grist_oidc_client_secret
    volumes:
      - pf-data:/var/lib/privacyfence-org/.privacyfence
      - pf-secrets:/run/suite:ro
    depends_on:
      init:
        condition: service_completed_successfully

  peek:
    image: ghcr.io/privacyfence/peek:${PEEK_IMAGE_TAG:?pin a version in .env}
    network_mode: "service:privacyfence"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PEEK_BASE_URL: http://localhost:7700
      PEEK_PROVISIONING_KEY_FILE: /run/suite/peek_provisioning_key
      PEEK_OIDC_ISSUER_URL: http://localhost:8765/oidc
      PEEK_OIDC_CLIENT_ID: peek
      PEEK_OIDC_CLIENT_SECRET_FILE: /run/suite/peek_oidc_client_secret
      PEEK_OIDC_ALLOW_PRIVATE_ISSUER: "true"
    volumes:
      - peek-data:/data
      - peek-secrets:/run/suite:ro
    depends_on:
      init:
        condition: service_completed_successfully
      privacyfence:
        condition: service_started

  grist:
    image: ghcr.io/privacyfence/grist-core:${GRIST_IMAGE_TAG:?pin a version in .env}
    network_mode: "service:privacyfence"
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        export GRIST_SESSION_SECRET="$$(cat /run/suite/grist_session_secret)"
        export GRIST_BOOT_KEY="$$(cat /run/suite/grist_boot_key)"
        export GRIST_OIDC_IDP_CLIENT_SECRET="$$(cat /run/suite/grist_oidc_client_secret)"
        node -e "const u=process.env.GRIST_OIDC_IDP_ISSUER+'/.well-known/openid-configuration';let n=0;const t=()=>fetch(u).then(r=>{if(!r.ok)throw 0;process.exit(0)}).catch(()=>{if(++n>=60){console.error('grist: PrivacyFence is not reachable at '+u);process.exit(1)}setTimeout(t,5000)});t()"
        exec ./sandbox/docker_entrypoint.sh "$$@"
      - grist
    command: ["./sandbox/run.sh"]
    environment:
      APP_HOME_URL: http://localhost:8484
      GRIST_SINGLE_ORG: team
      GRIST_ADMIN_EMAIL: grist-admin@privacyfence.localhost
      GRIST_IN_SERVICE: "true"
      GRIST_ORG_CREATION_ANYONE: "false"
      GRIST_PERSONAL_ORGS: "false"
      GRIST_FORCE_LOGIN: "true"
      GRIST_OIDC_IDP_ISSUER: http://localhost:8765/oidc
      GRIST_OIDC_IDP_CLIENT_ID: grist
      GRIST_OIDC_IDP_SCOPES: openid email profile
      GRIST_OIDC_IDP_SKIP_END_SESSION_ENDPOINT: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8484/status').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      retries: 60
      start_period: 60s
    volumes:
      - grist-data:/persist
      - grist-secrets:/run/suite:ro
    depends_on:
      init:
        condition: service_completed_successfully
      privacyfence:
        condition: service_healthy

  grist-provisioner:
    image: ghcr.io/privacyfence/grist-provisioner:${GRIST_PROVISIONER_IMAGE_TAG:?pin a version in .env}
    network_mode: "service:privacyfence"
    user: "1001:1001"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      GRIST_ADMIN_EMAIL: grist-admin@privacyfence.localhost
      PROVISIONER_KEY_FILE: /run/suite/grist_provisioning_key
      PROVISIONER_GRIST_URL: http://localhost:8484
      PROVISIONER_GRIST_TEAM_SITE: team
      PROVISIONER_GRIST_BOOT_KEY_FILE: /run/suite/grist_boot_key
      PROVISIONER_ALLOWED_DOMAINS: privacyfence.localhost
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8485/healthz', timeout=3)"]
    volumes:
      - grist-data:/persist
      - provisioner-data:/data
      - provisioner-secrets:/run/suite:ro
    depends_on:
      init:
        condition: service_completed_successfully
      grist:
        condition: service_healthy

volumes:
  pf-data:
  peek-data:
  grist-data:
  provisioner-data:
  pf-secrets:
  peek-secrets:
  grist-secrets:
  provisioner-secrets:
