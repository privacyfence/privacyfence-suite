name: fixture
services:
  init:
    image: alpine:${ALPINE_IMAGE_TAG:?pin a version in .env}
    network_mode: none
    command: ["/bin/sh", "/init.sh"]
    volumes:
      - ./init.sh:/init.sh:ro
      - pf-secrets:/out/pf
      - peek-secrets:/out/peek
      - grist-secrets:/out/grist
      - provisioner-secrets:/out/provisioner
  privacyfence:
    image: ghcr.io/privacyfence/privacyfence-org:${PRIVACYFENCE_IMAGE_TAG:?pin a version in .env}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PRIVACYFENCE_TRUSTED_PROXIES: 172.30.87.2
      PRIVACYFENCE_ALLOWED_DOMAINS: ${ALLOWED_DOMAIN:?set ALLOWED_DOMAIN in .env}
      PRIVACYFENCE_PEEK_PROVISIONING_KEY_FILE: /run/suite/peek_provisioning_key
    volumes:
      - pf-secrets:/run/suite:ro
    depends_on:
      init:
        condition: service_completed_successfully
  peek:
    image: ghcr.io/privacyfence/peek:${PEEK_IMAGE_TAG:?pin a version in .env}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PEEK_PROVISIONING_KEY_FILE: /run/suite/peek_provisioning_key
    volumes:
      - peek-secrets:/run/suite:ro
    depends_on:
      init:
        condition: service_completed_successfully
  grist:
    image: ghcr.io/privacyfence/grist-core:${GRIST_IMAGE_TAG:?pin a version in .env}
    environment:
      GRIST_SINGLE_ORG: ${GRIST_TEAM_SITE:-team}
    volumes:
      - grist-secrets:/run/suite:ro
    depends_on:
      init:
        condition: service_completed_successfully
  grist-provisioner:
    image: ghcr.io/privacyfence/grist-provisioner:${GRIST_PROVISIONER_IMAGE_TAG:?pin a version in .env}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PROVISIONER_KEY_FILE: /run/suite/grist_provisioning_key
    volumes:
      - provisioner-secrets:/run/suite:ro
    depends_on:
      init:
        condition: service_completed_successfully
  caddy:
    image: caddy:${CADDY_IMAGE_TAG:?pin a version in .env}
    environment:
      PF_HOSTNAME: ${PF_HOSTNAME:?set PF_HOSTNAME in .env}
      PEEK_HOSTNAME: ${PEEK_HOSTNAME:?set PEEK_HOSTNAME in .env}
      GRIST_HOSTNAME: ${GRIST_HOSTNAME:?set GRIST_HOSTNAME in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      pf:
        ipv4_address: 172.30.87.2
        aliases:
          - ${PF_HOSTNAME:?set PF_HOSTNAME in .env}
          - ${PEEK_HOSTNAME:?set PEEK_HOSTNAME in .env}
          - ${GRIST_HOSTNAME:?set GRIST_HOSTNAME in .env}
    depends_on:
      init:
        condition: service_completed_successfully
networks:
  pf:
    ipam:
      config:
        - subnet: 172.30.87.0/24
volumes:
  pf-secrets:
  peek-secrets:
  grist-secrets:
  provisioner-secrets:
