# PrivacyFence (organization mode), Peek and Grist in one stack, for a server that already runs them
# separately: PrivacyFence from pip under systemd, Peek and Grist as their own containers, all behind the
# nginx on the host. See README.md for the migration, which keeps every app's data.
#
# Differences from configs/nginx-google:
#  - every app is also published on 127.0.0.1 at the port it had (8765, 7700, 8484; the new
#    provisioner on 8485), so the host's nginx keeps its 127.0.0.1 upstreams;
#  - PrivacyFence's server and identity-provider settings come from privacyfence.env (what
#    `privacyfence-app --print-env-from-bundle` printed on the pip install), not from compose;
#  - the Grist team site is the one the old Grist already has (GRIST_TEAM_SITE, no default).
name: privacyfence-host

services:
  init:
    image: alpine:${ALPINE_IMAGE_TAG:?pin a version in .env}
    network_mode: none
    command: ["/bin/sh", "/init.sh"]
    volumes:
      - ./init.sh:/init.sh:ro
      - ./secrets:/user-secrets:ro
      - pf-secrets:/out/pf
      - peek-secrets:/out/peek
      - grist-secrets:/out/grist
      - provisioner-secrets:/out/provisioner

  privacyfence:
    image: ghcr.io/privacyfence/privacyfence-org:${PRIVACYFENCE_IMAGE_TAG:?pin a version in .env}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      # Mode, identity provider and admins, moved out of the 6.x bundle (README.md, step 1).
      - path: privacyfence.env
        required: true
    environment:
      # These win over privacyfence.env: the pip install bound 127.0.0.1 and trusted 127.0.0.1,
      # in the container nginx arrives from the pf-suite gateway.
      PRIVACYFENCE_BIND_HOST: 0.0.0.0
      PRIVACYFENCE_PORT: "8765"
      PRIVACYFENCE_ISSUER_URL: https://${PF_HOSTNAME:?set PF_HOSTNAME in .env}
      PRIVACYFENCE_TRUSTED_PROXIES: 172.30.87.1
      PRIVACYFENCE_PEEK_BASE_URL: https://${PEEK_HOSTNAME:?set PEEK_HOSTNAME in .env}
      PRIVACYFENCE_PEEK_PROVISIONING_KEY_FILE: /run/suite/peek_provisioning_key
      PRIVACYFENCE_PEEK_AUTO_PROVISION: "true"
      PRIVACYFENCE_GRIST_SERVER_URL: https://${GRIST_HOSTNAME:?set GRIST_HOSTNAME in .env}
      PRIVACYFENCE_GRIST_PROVISIONER_URL: https://${GRIST_HOSTNAME:?set GRIST_HOSTNAME in .env}
      PRIVACYFENCE_GRIST_PROVISIONING_KEY_FILE: /run/suite/grist_provisioning_key
      PRIVACYFENCE_GRIST_AUTO_PROVISION: "true"
      PRIVACYFENCE_OIDC_CLIENTS: peek,grist
      PRIVACYFENCE_OIDC_CLIENT_PEEK_REDIRECT_URIS: https://${PEEK_HOSTNAME:?set PEEK_HOSTNAME in .env}/oauth/oidc/callback
      PRIVACYFENCE_OIDC_CLIENT_PEEK_SECRET_FILE: /run/suite/peek_oidc_client_secret
      PRIVACYFENCE_OIDC_CLIENT_GRIST_REDIRECT_URIS: https://${GRIST_HOSTNAME:?set GRIST_HOSTNAME in .env}/oauth2/callback
      PRIVACYFENCE_OIDC_CLIENT_GRIST_SECRET_FILE: /run/suite/grist_oidc_client_secret
    volumes:
      - pf-data:/var/lib/privacyfence-org/.privacyfence
      - pf-secrets:/run/suite:ro
    extra_hosts:
      - "${PF_HOSTNAME:?set PF_HOSTNAME in .env}:172.30.87.1"
      - "${PEEK_HOSTNAME:?set PEEK_HOSTNAME in .env}:172.30.87.1"
      - "${GRIST_HOSTNAME:?set GRIST_HOSTNAME in .env}:172.30.87.1"
    networks:
      pf:
        ipv4_address: 172.30.87.10
    depends_on:
      init:
        condition: service_completed_successfully

  peek:
    image: ghcr.io/privacyfence/peek:${PEEK_IMAGE_TAG:?pin a version in .env}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:7700:7700"
    environment:
      PEEK_BASE_URL: https://${PEEK_HOSTNAME:?set PEEK_HOSTNAME in .env}
      PEEK_TRUSTED_PROXY: "true"
      PEEK_TRUSTED_PROXY_CIDRS: 172.30.87.1/32
      PEEK_ADMIN_EMAILS: ${PEEK_ADMIN_EMAILS:-}
      PEEK_ALLOWED_EMAIL_DOMAIN: ${ALLOWED_DOMAIN:?set ALLOWED_DOMAIN in .env}
      PEEK_OIDC_SIGNUP: "true"
      PEEK_PROVISIONING_KEY_FILE: /run/suite/peek_provisioning_key
      # The name of the provisioner the 6.11 server already uses in Peek: the key is rotated in
      # place, so the accounts it provisioned stay linked.
      PEEK_PROVISIONING_KEY_NAME: ${PEEK_PROVISIONING_KEY_NAME:-PrivacyFence}
      PEEK_OIDC_ISSUER_URL: https://${PF_HOSTNAME:?set PF_HOSTNAME in .env}/oidc
      PEEK_OIDC_CLIENT_ID: peek
      PEEK_OIDC_CLIENT_SECRET_FILE: /run/suite/peek_oidc_client_secret
      PEEK_OIDC_ALLOW_PRIVATE_ISSUER: "true"
    volumes:
      - peek-data:/data
      - peek-secrets:/run/suite:ro
    extra_hosts:
      - "${PF_HOSTNAME:?set PF_HOSTNAME in .env}:172.30.87.1"
      - "${PEEK_HOSTNAME:?set PEEK_HOSTNAME in .env}:172.30.87.1"
      - "${GRIST_HOSTNAME:?set GRIST_HOSTNAME in .env}:172.30.87.1"
    networks:
      pf:
        ipv4_address: 172.30.87.11
    depends_on:
      init:
        condition: service_completed_successfully

  grist:
    image: ghcr.io/privacyfence/grist-core:${GRIST_IMAGE_TAG:?pin a version in .env}
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        export GRIST_SESSION_SECRET="$$(cat /run/suite/grist_session_secret)"
        export GRIST_BOOT_KEY="$$(cat /run/suite/grist_boot_key)"
        export GRIST_OIDC_IDP_CLIENT_SECRET="$$(cat /run/suite/grist_oidc_client_secret)"
        node -e "const u=process.env.GRIST_OIDC_IDP_ISSUER+'/.well-known/openid-configuration';let n=0;const t=()=>fetch(u).then(r=>{if(!r.ok)throw 0;process.exit(0)}).catch(()=>{if(++n>=60){console.error('grist: PrivacyFence is not reachable at '+u);process.exit(1)}setTimeout(t,5000)});t()"
        exec ./sandbox/docker_entrypoint.sh "$$@"
      - grist
    command: ["./sandbox/run.sh"]
    ports:
      - "127.0.0.1:8484:8484"
    environment:
      APP_HOME_URL: https://${GRIST_HOSTNAME:?set GRIST_HOSTNAME in .env}
      GRIST_SINGLE_ORG: ${GRIST_TEAM_SITE:?set GRIST_TEAM_SITE in .env}
      GRIST_ADMIN_EMAIL: ${GRIST_ADMIN_EMAIL:?set GRIST_ADMIN_EMAIL in .env}
      GRIST_IN_SERVICE: "true"
      GRIST_ORG_CREATION_ANYONE: "false"
      GRIST_PERSONAL_ORGS: "false"
      GRIST_FORCE_LOGIN: "true"
      GRIST_OIDC_IDP_ISSUER: https://${PF_HOSTNAME:?set PF_HOSTNAME in .env}/oidc
      GRIST_OIDC_IDP_CLIENT_ID: grist
      GRIST_OIDC_IDP_SCOPES: openid email profile
      GRIST_OIDC_IDP_SKIP_END_SESSION_ENDPOINT: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8484/status').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      retries: 60
      start_period: 60s
    volumes:
      - grist-data:/persist
      - grist-secrets:/run/suite:ro
    extra_hosts:
      - "${PF_HOSTNAME:?set PF_HOSTNAME in .env}:172.30.87.1"
      - "${PEEK_HOSTNAME:?set PEEK_HOSTNAME in .env}:172.30.87.1"
      - "${GRIST_HOSTNAME:?set GRIST_HOSTNAME in .env}:172.30.87.1"
    networks:
      pf:
        ipv4_address: 172.30.87.12
    depends_on:
      init:
        condition: service_completed_successfully
      privacyfence:
        condition: service_healthy

  grist-provisioner:
    image: ghcr.io/privacyfence/grist-provisioner:${GRIST_PROVISIONER_IMAGE_TAG:?pin a version in .env}
    user: "1001:1001"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      # Only nginx's /api/provisioning/ location uses this, and it admits PrivacyFence alone.
      - "127.0.0.1:8485:8485"
    environment:
      GRIST_ADMIN_EMAIL: ${GRIST_ADMIN_EMAIL:?set GRIST_ADMIN_EMAIL in .env}
      PROVISIONER_KEY_FILE: /run/suite/grist_provisioning_key
      PROVISIONER_GRIST_URL: http://grist:8484
      PROVISIONER_GRIST_TEAM_SITE: ${GRIST_TEAM_SITE:?set GRIST_TEAM_SITE in .env}
      PROVISIONER_GRIST_BOOT_KEY_FILE: /run/suite/grist_boot_key
      PROVISIONER_ALLOWED_DOMAINS: ${ALLOWED_DOMAIN:?set ALLOWED_DOMAIN in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8485/healthz', timeout=3)"]
    volumes:
      - grist-data:/persist
      - provisioner-data:/data
      - provisioner-secrets:/run/suite:ro
    networks:
      pf:
        ipv4_address: 172.30.87.13
    depends_on:
      init:
        condition: service_completed_successfully
      grist:
        condition: service_healthy

networks:
  pf:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: pf-suite
    ipam:
      config:
        - subnet: 172.30.87.0/24
          gateway: 172.30.87.1

volumes:
  pf-data:
  peek-data:
  grist-data:
  provisioner-data:
  pf-secrets:
  peek-secrets:
  grist-secrets:
  provisioner-secrets:
